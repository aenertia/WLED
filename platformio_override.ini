[env:m5stickc]
board = m5stick-c
platform = ${esp32_idf_V4.platform}
platform_packages = ${esp32_idf_V4.platform_packages}
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags}
  -D WLED_RELEASE_NAME=\"M5StickC\"
  -D DATA_PINS=26
  -D DEFAULT_LED_COUNT=60
  -D DEFAULT_LED_TYPE=TYPE_WS2812_RGB
  -D BTNPIN=37
  -D MDNS_NAME=\"wled\"
  -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps = ${esp32_idf_V4.lib_deps}
board_build.partitions = ${esp32.big_partitions}
board_build.flash_mode = dio
monitor_filters = esp32_exception_decoder
monitor_speed = 115200

[env:m5stickc_lean]
extends = env:m5stickc
build_flags = ${env:m5stickc.build_flags}
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_OTA
  -D WLED_DISABLE_ESPNOW
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_2D
  -D WLED_DISABLE_BROWNOUT_DET
  -D WLED_DISABLE_ADALIGHT

; PPP feasibility spike — headers exist in IDF 4.4.8 but liblwip.a was
; compiled WITHOUT CONFIG_LWIP_PPP_SUPPORT.  This env proves the #include
; compiles; actual PPP needs an IDF-framework rebuild or patched liblwip.a.
[env:m5stickc_ppp_spike]
extends = env:m5stickc_lean
build_flags = ${env:m5stickc_lean.build_flags}
  -D CONFIG_LWIP_PPP_SUPPORT=1
  -D CONFIG_LWIP_PPP_SERVER_SUPPORT=1
