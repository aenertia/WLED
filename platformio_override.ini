; ============================================================
; M5StickC WLED — Build Variants
; ============================================================

; --- Base board env (V5 framework, M5StickC) ---
[env:m5stickc]
board = m5stick-c
platform = ${esp32_idf_V5.platform}
platform_packages = ${esp32_idf_V5.platform_packages}
build_unflags = ${common.build_unflags}
  ${esp32_idf_V5.build_unflags}
build_flags = ${common.build_flags} ${esp32_idf_V5.build_flags}
  -D WLED_RELEASE_NAME=\"M5StickC\"
  -D DATA_PINS=26
  -D DEFAULT_LED_COUNT=60
  -D DEFAULT_LED_TYPE=TYPE_WS2812_RGB
  -D BTNPIN=37
  -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps = ${esp32_idf_V5.lib_deps}
lib_ignore = ${esp32_idf_V5.lib_ignore}
board_build.partitions = ${esp32.big_partitions}
board_build.flash_mode = dio
monitor_filters = esp32_exception_decoder
monitor_speed = 115200

; --- Shared fragments ---

[m5stickc_hw]
; SPI_MATRIX as default is now safe on fresh NVS — initAXP192() runs before
; beginStrip(), and BusSPIMatrix constructor bails gracefully if AXP192 fails.
; DATA_PINS=5 is the TFT CS pin (used by BusSPIMatrix for pin validation).
; DEFAULT_LED_COUNT must match SPI_MATRIX_W * SPI_MATRIX_H (40*80=3200)
; so the auto-segment covers the full SPI matrix bus range on fresh NVS.
build_flags =
  -D LED_TYPES=TYPE_SPI_MATRIX
  -D DATA_PINS=5
  -D DEFAULT_LED_TYPE=TYPE_SPI_MATRIX
  -D DEFAULT_LED_COUNT=3200
  -D BTNPIN=37,39
  -D BTNTYPE=BTN_TYPE_PUSH,BTN_TYPE_PUSH
  -DARDUINO_USB_CDC_ON_BOOT=0

[m5stickc_lean_disables]
build_flags =
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_OTA
  -D WLED_DISABLE_ESPNOW
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_BROWNOUT_DET
  -D WLED_DISABLE_ADALIGHT
  -D MAX_SEGMENT_DATA=16384

[m5stickc_slip_ftdi_flags]
; SLIP via FTDI USB — UART0 default pins, 1.5Mbps, host runs wled-serial-bridge
build_flags =
  -D WLED_USE_SLIP
  -D SLIP_BAUD=1500000
  -D WLED_DISABLE_IMPROV_WIFISCAN
  -D WLED_ENABLE_DDP_COMPRESSION
  -D WLED_ENABLE_GIF
  -D ARGB_RX_PIN=32
  -D ARGB_MAX_LEDS=100

; --- PPP UART speed profiles (mix into any PPP env) ---
; Buffer sizing and DDP packet limits auto-derive from PPP_MRU in wled_ppp.h / ESPAsyncE131.h

[ppp_uart_fast]
; FTDI/CH9102/FT2232H at 1.5Mbps+ — MTU 4096 for single-packet 800px DDP
build_flags =
  -D PPP_BAUD=1500000
  -D PPP_MRU=1500
  -D PPP_MAXMRU=1500

[ppp_uart_slow]
; CP2102 at 921600 — MTU 1500, compressed DDP only, max ~5fps at 160x80
build_flags =
  -D PPP_BAUD=1500000
  -D PPP_MRU=1500
  -D PPP_MAXMRU=1500

[m5stickc_ppp_ftdi_flags]
; PPP via FTDI USB — UART0 default pins, 1.5Mbps, host runs standard pppd
build_flags =
  -D WLED_USE_PPP
  -D WLED_USE_PPP_UART
  -D WLED_PPP_WIFI
  -D PPP_BAUD=1500000
  -D PPP_TX_PIN=1
  -D PPP_RX_PIN=3
  -D WLED_DISABLE_IMPROV_WIFISCAN
  -D WLED_ENABLE_DDP_COMPRESSION
  -D WLED_ENABLE_GIF
  -D WLED_ENABLE_ARGB_PASSTHROUGH
  -D ARGB_RX_PIN=32
  -D ARGB_MAX_LEDS=100

[m5stickc_ppp_pico_flags]
; PPP via Pi Pico bridge — UART1 on Grove G32/G33, 5Mbps
; ARGB passthrough on G36 (HAT, input-only — works for RMT RX)
; ESP32 PPP IPs unchanged (169.254.7.x) — Pico does NAT/masquerade
build_flags =
  -D WLED_USE_PPP
  -D WLED_USE_PPP_UART
  -D PPP_BAUD=5000000
  -D PPP_UART_NUM=UART_NUM_1
  -D PPP_TX_PIN=32
  -D PPP_RX_PIN=33
  -D WLED_ENABLE_ARGB_PASSTHROUGH
  -D WLED_ENABLE_DDP_COMPRESSION
  -D ARGB_RX_PIN=36
  -D ARGB_MAX_LEDS=100
  -D WLED_DISABLE_IMPROV_WIFISCAN

[m5stickc_tft_flags]
; M5StickC ST7735S 80x160 TFT at native 160x80 resolution (1:1 pixels)
; SPI Matrix bus flag layering:
;   WLED_ENABLE_SPI_MATRIX          — enables the bus class (generic, any SPI display)
;   WLED_SPI_MATRIX_AXP192          — M5StickC board support: compiles initAXP192()
;   WLED_SPI_MATRIX_BOARD_INIT=initAXP192  — wires PMIC init into bus constructor
build_flags =
  -D WLED_ENABLE_SPI_MATRIX
  -D WLED_SPI_MATRIX_AXP192
  -D WLED_SPI_MATRIX_BOARD_INIT=initAXP192
  -D SPI_MATRIX_W=40
  -D SPI_MATRIX_H=80
  -D USER_SETUP_LOADED
  -D ST7735_DRIVER
  -D ST7735_GREENTAB160x80
  -D CGRAM_OFFSET
  -D TFT_WIDTH=80
  -D TFT_HEIGHT=160
  -D TFT_MOSI=15
  -D TFT_SCLK=13
  -D TFT_CS=5
  -D TFT_DC=23
  -D TFT_RST=18
  -D TFT_MISO=-1
  -D SPI_FREQUENCY=27000000
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_ON
lib_deps =
  bodmer/TFT_eSPI@^2.5.0

[m5stickc_pico_sdkconfig]
; Pico variant: UART0/FTDI free for debug console (PPP on UART1)
custom_sdkconfig =
  CONFIG_LWIP_TCPIP_CORE_LOCKING=y
  CONFIG_LWIP_TCPIP_CORE_LOCKING_INPUT=y
  CONFIG_LWIP_PPP_SUPPORT=y
  CONFIG_LWIP_PPP_SERVER_SUPPORT=y
  CONFIG_LWIP_PPP_PAP_SUPPORT=y
  CONFIG_LWIP_PPP_ENABLE_IPV4=y
  CONFIG_LWIP_ENABLE_LCP_ECHO=y
  CONFIG_LWIP_LCP_ECHOINTERVAL=3
  CONFIG_LWIP_LCP_MAXECHOFAILS=3
  CONFIG_LWIP_MAX_SOCKETS=16
  CONFIG_LWIP_TCP_SND_BUF_DEFAULT=5744
  CONFIG_LWIP_TCP_WND_DEFAULT=5744
  CONFIG_ESP_WIFI_ENABLED=n
  CONFIG_BT_ENABLED=n
  CONFIG_COMPILER_OPTIMIZATION_SIZE=y
  CONFIG_BOOTLOADER_COMPILER_OPTIMIZATION_SIZE=y
  CONFIG_LOG_DEFAULT_LEVEL_WARN=y
  CONFIG_ESP_CONSOLE_UART=y
  CONFIG_ESP_CONSOLE_UART_NUM=0
  CONFIG_ESP_INT_WDT_TIMEOUT_MS=800
  CONFIG_ARDUINO_LOOP_STACK_SIZE=8192

[m5stickc_ppp_sdkconfig]
custom_sdkconfig =
  CONFIG_LWIP_TCPIP_CORE_LOCKING=y
  CONFIG_LWIP_TCPIP_CORE_LOCKING_INPUT=y
  CONFIG_LWIP_PPP_SUPPORT=y
  CONFIG_LWIP_PPP_SERVER_SUPPORT=y
  CONFIG_LWIP_PPP_PAP_SUPPORT=y
  CONFIG_LWIP_PPP_ENABLE_IPV4=y
  CONFIG_LWIP_ENABLE_LCP_ECHO=y
  CONFIG_LWIP_LCP_ECHOINTERVAL=3
  CONFIG_LWIP_LCP_MAXECHOFAILS=3
  CONFIG_LWIP_MAX_SOCKETS=16
  CONFIG_LWIP_TCP_SND_BUF_DEFAULT=5744
  CONFIG_LWIP_TCP_WND_DEFAULT=5744
  CONFIG_ESP_WIFI_ENABLED=n
  CONFIG_BT_ENABLED=n
  CONFIG_COMPILER_OPTIMIZATION_SIZE=y
  CONFIG_BOOTLOADER_COMPILER_OPTIMIZATION_SIZE=y
  CONFIG_LOG_DEFAULT_LEVEL_WARN=y
  CONFIG_ESP_CONSOLE_NONE=y
  CONFIG_ESP_INT_WDT_TIMEOUT_MS=800
  CONFIG_ARDUINO_LOOP_STACK_SIZE=8192

; --- Lean env (WiFi, no PPP) ---
[env:m5stickc_lean]
extends = env:m5stickc
build_flags = ${env:m5stickc.build_flags}
  ${m5stickc_lean_disables.build_flags}
lib_ignore = ${esp32_idf_V5.lib_ignore}
  wled-espnow

; --- PPP board base (shared by all PPP/Pico envs) ---
[m5stickc_ppp_board]
board = m5stick-c
platform = ${esp32_idf_V5.platform}
platform_packages = ${esp32_idf_V5.platform_packages}
build_unflags = ${common.build_unflags}
  ${esp32_idf_V5.build_unflags}
lib_deps = ${esp32_idf_V5.lib_deps}
  bodmer/TFT_eSPI@^2.5.0
lib_ignore = ${esp32_idf_V5.lib_ignore}
  wled-espnow
board_build.partitions = ${esp32.big_partitions}
board_build.flash_mode = dio
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
custom_sdkconfig = ${m5stickc_ppp_sdkconfig.custom_sdkconfig}

; ============================================================
; FTDI USB variants — UART0, 1.5Mbps
; ============================================================

[env:m5stickc_slip]
extends = m5stickc_ppp_board
build_flags = ${common.build_flags} ${esp32_idf_V5.build_flags}
  ${m5stickc_hw.build_flags}
  ${m5stickc_lean_disables.build_flags}
  ${m5stickc_slip_ftdi_flags.build_flags}
  ${m5stickc_tft_flags.build_flags}
  -D WLED_RELEASE_NAME=\"M5StickC_SLIP\"

[env:m5stickc_ppp]
extends = m5stickc_ppp_board
build_flags = ${common.build_flags} ${esp32_idf_V5.build_flags}
  ${m5stickc_hw.build_flags}
  ${m5stickc_lean_disables.build_flags}
  -D WLED_USE_PPP
  -D WLED_USE_PPP_UART
  ; NO WLED_PPP_WIFI - pure PPP, no WiFi stack, maximum heap
  -D PPP_BAUD=1500000
  -D PPP_TX_PIN=1
  -D PPP_RX_PIN=3
  -D WLED_DISABLE_IMPROV_WIFISCAN
  -D WLED_ENABLE_DDP_COMPRESSION
  -D WLED_DISABLE_2D
  -D PPP_MRU=1500
  -D PPP_MAXMRU=1500
  ${m5stickc_tft_flags.build_flags}
  -D WS_MAX_QUEUED_MESSAGES=2
  -D DEFAULT_MAX_WS_CLIENTS=1
  -D JSON_BUFFER_SIZE=6144
  -D WLED_RELEASE_NAME=\"M5StickC_PPP\"

[env:m5stickc_pico]
extends = m5stickc_ppp_board
build_flags = ${common.build_flags} ${esp32_idf_V5.build_flags}
  ${m5stickc_hw.build_flags}
  ${m5stickc_lean_disables.build_flags}
  ${m5stickc_ppp_pico_flags.build_flags}
  ${m5stickc_tft_flags.build_flags}
  -D WLED_RELEASE_NAME=\"M5StickC_Pico\"
custom_sdkconfig = ${m5stickc_pico_sdkconfig.custom_sdkconfig}

; ============================================================
; TIER 2: ESP32-S3 — Single-MCU candidates (native USB)
; ============================================================
; These are the KEY targets. S3 native USB-OTG enables CDC-ECM/NCM
; eliminating the need for a Pi Pico bridge. For now: lean WLED +
; ARGB passthrough, no PPP/USB-networking yet (Phase C).

[m5stickc_s3_common]
; Common flags for all our custom S3 builds
build_flags =
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_OTA
  -D WLED_DISABLE_ESPNOW
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_2D
  -D WLED_DISABLE_BROWNOUT_DET
  -D WLED_DISABLE_IMPROV_WIFISCAN
  -D WLED_ENABLE_DDP_COMPRESSION
  -D MDNS_NAME=\"wled\"
  -D DEFAULT_LED_COUNT=60
  -D DEFAULT_LED_TYPE=TYPE_WS2812_RGB
  -D WLED_ENABLE_ARGB_PASSTHROUGH
  -D ARGB_MAX_LEDS=100

[env:atoms3_lean]
extends = esp32s3
board = m5stack-atoms3
board_build.partitions = ${esp32.large_partitions}
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
build_flags = ${common.build_flags} ${esp32s3.build_flags}
  ${m5stickc_s3_common.build_flags}
  -D WLED_RELEASE_NAME=\"AtomS3\"
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=0
  -D DATA_PINS=5
  -D BTNPIN=41
  -D ARGB_RX_PIN=6
lib_deps = ${esp32s3.lib_deps}
lib_ignore = ${esp32s3.lib_ignore}
  wled-espnow
monitor_speed = 115200

[env:atoms3u_lean]
extends = esp32s3
board = m5stack-atoms3u
board_build.partitions = ${esp32.large_partitions}
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
build_flags = ${common.build_flags} ${esp32s3.build_flags}
  ${m5stickc_s3_common.build_flags}
  -D WLED_RELEASE_NAME=\"AtomS3U\"
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=0
  -D DATA_PINS=5
  -D BTNPIN=41
  -D ARGB_RX_PIN=6
lib_deps = ${esp32s3.lib_deps}
lib_ignore = ${esp32s3.lib_ignore}
  wled-espnow
monitor_speed = 115200

[env:stamps3_lean]
extends = esp32s3
board = m5stack-stamps3
board_build.partitions = ${esp32.large_partitions}
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
build_flags = ${common.build_flags} ${esp32s3.build_flags}
  ${m5stickc_s3_common.build_flags}
  -D WLED_RELEASE_NAME=\"StampS3\"
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=0
  -D DATA_PINS=1
  -D BTNPIN=0
  -D ARGB_RX_PIN=2
lib_deps = ${esp32s3.lib_deps}
lib_ignore = ${esp32s3.lib_ignore}
  wled-espnow
monitor_speed = 115200

[env:esp32s3_8m_lean]
extends = esp32s3
board = esp32-s3-devkitc-1
board_build.partitions = ${esp32.large_partitions}
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
build_flags = ${common.build_flags} ${esp32s3.build_flags}
  ${m5stickc_s3_common.build_flags}
  -D WLED_RELEASE_NAME=\"ESP32S3_8M\"
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=0
  -D DATA_PINS=48
  -D ARGB_RX_PIN=47
lib_deps = ${esp32s3.lib_deps}
lib_ignore = ${esp32s3.lib_ignore}
  wled-espnow
monitor_speed = 115200

; ============================================================
; TIER 3: ESP32 Classic — PPP variants (need Pico bridge)
; ============================================================

[env:esp32dev_ppp]
extends = esp32
board = esp32dev
board_build.partitions = ${esp32.big_partitions}
board_build.arduino.memory_type = dio_qspi
board_build.flash_mode = dio
build_flags = ${common.build_flags} ${esp32.build_flags}
  ${m5stickc_s3_common.build_flags}
  -D WLED_USE_PPP
  -D WLED_USE_PPP_UART
  -D WLED_PPP_WIFI
  -D PPP_BAUD=1500000
  -D PPP_TX_PIN=1
  -D PPP_RX_PIN=3
  -D WLED_RELEASE_NAME=\"ESP32_PPP\"
  -D WLED_DISABLE_ADALIGHT
  -D DATA_PINS=16
  -D ARGB_RX_PIN=17
  -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps = ${esp32.lib_deps}
lib_ignore = ${esp32_idf_V5.lib_ignore}
  wled-espnow
custom_sdkconfig = ${m5stickc_ppp_sdkconfig.custom_sdkconfig}
monitor_speed = 115200

[env:esp32_wrover_ppp]
extends = env:esp32dev_ppp
board = esp-wrover-kit
build_flags = ${env:esp32dev_ppp.build_flags}
  -DBOARD_HAS_PSRAM
  -D WLED_RELEASE_NAME=\"WROVER_PPP\"

; ============================================================
; TIER 4: ESP32-C3 — RISC-V minimal (PPP, need Pico)
; ============================================================

[env:esp32c3_ppp]
extends = esp32c3
board = esp32-c3-devkitm-1
board_build.partitions = ${esp32.default_partitions}
build_flags = ${common.build_flags} ${esp32c3.build_flags}
  ${m5stickc_s3_common.build_flags}
  -D WLED_USE_PPP
  -D WLED_USE_PPP_UART
  -D WLED_PPP_WIFI
  -D PPP_BAUD=1500000
  -D PPP_TX_PIN=1
  -D PPP_RX_PIN=3
  -D WLED_RELEASE_NAME=\"C3_PPP\"
  -D WLED_DISABLE_ADALIGHT
  -DARDUINO_USB_CDC_ON_BOOT=0
  -D DATA_PINS=8
  -D ARGB_RX_PIN=9
lib_deps = ${esp32c3.lib_deps}
lib_ignore = ${esp32_idf_V5.lib_ignore}
  wled-espnow
custom_sdkconfig = ${m5stickc_ppp_sdkconfig.custom_sdkconfig}
monitor_speed = 115200

; --- WiFi+PPP coexistence sdkconfig (WiFi stays enabled) ---
[m5stickc_ppp_wifi_sdkconfig]
custom_sdkconfig =
  CONFIG_LWIP_TCPIP_CORE_LOCKING=y
  CONFIG_LWIP_TCPIP_CORE_LOCKING_INPUT=y
  CONFIG_LWIP_PPP_SUPPORT=y
  CONFIG_LWIP_PPP_SERVER_SUPPORT=y
  CONFIG_LWIP_PPP_PAP_SUPPORT=y
  CONFIG_LWIP_PPP_ENABLE_IPV4=y
  CONFIG_LWIP_ENABLE_LCP_ECHO=n
  CONFIG_LWIP_LCP_ECHOINTERVAL=0
  CONFIG_LWIP_LCP_MAXECHOFAILS=10
  CONFIG_LWIP_MAX_SOCKETS=4
  CONFIG_LWIP_TCP_SND_BUF_DEFAULT=5744
  CONFIG_LWIP_TCP_WND_DEFAULT=5744
  CONFIG_BT_ENABLED=n
  CONFIG_COMPILER_OPTIMIZATION_SIZE=y
  CONFIG_BOOTLOADER_COMPILER_OPTIMIZATION_SIZE=y
  CONFIG_LOG_DEFAULT_LEVEL_WARN=y
  CONFIG_ESP_CONSOLE_NONE=y
  CONFIG_ESP_INT_WDT_TIMEOUT_MS=1200
  CONFIG_LWIP_MAX_ACTIVE_TCP=4
  CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=8
  CONFIG_ESP_WIFI_AMPDU_TX_ENABLED=n
  CONFIG_ESP_WIFI_AMPDU_RX_ENABLED=n
  CONFIG_ARDUINO_LOOP_STACK_SIZE=8192
  CONFIG_LWIP_UDP_RECVMBOX_SIZE=6
  CONFIG_LWIP_TCPIP_RECVMBOX_SIZE=4
  CONFIG_LWIP_PBUF_POOL_SIZE=16
  CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=y
  CONFIG_ESP_COREDUMP_DATA_FORMAT_ELF=y
  CONFIG_ESP_COREDUMP_CHECKSUM_SHA256=y
  CONFIG_ESP_COREDUMP_MAX_TASKS_NUM=64
  CONFIG_ESP_COREDUMP_ENABLE_TO_NONE=n
  CONFIG_ARDUINO_UDP_TASK_STACK_SIZE=8192

; ============================================================
; WiFi + PPP coexistence — FTDI USB, dual network paths
; ============================================================

[env:m5stickc_ppp_wifi]
build_unflags = ${common.build_unflags}
  ${esp32_idf_V5.build_unflags}
extends = m5stickc_ppp_board
build_flags = ${common.build_flags} ${esp32_idf_V5.build_flags}
  ${m5stickc_hw.build_flags}
  ${m5stickc_lean_disables.build_flags}
  -D WLED_USE_PPP
  -D WLED_USE_PPP_UART
  -D WLED_PPP_WIFI
  -D PPP_BAUD=1500000
  -D PPP_TX_PIN=1
  -D PPP_RX_PIN=3
  -D WLED_DISABLE_IMPROV_WIFISCAN
  -D WLED_ENABLE_DDP_COMPRESSION
  -D WLED_ENABLE_GIF
  -D WLED_ENABLE_PIXART
  ${m5stickc_tft_flags.build_flags}
  -D WS_MAX_QUEUED_MESSAGES=2
  -D DEFAULT_MAX_WS_CLIENTS=1
  -D JSON_BUFFER_SIZE=6144
  -D PPP_MRU=1500
  -D PPP_MAXMRU=1500
  ; Raise DDP payload limit for PPP (no Ethernet MTU constraint)
  -D CLIENT_SSID='"kainga-atawhai"'
  -D CLIENT_PASS='"q1w2e3o0"'
  -D WLED_RELEASE_NAME=\"M5StickC_PPP_WiFi\"
  -D WLED_WATCHDOG_TIMEOUT=30
  -Wl,-u,esp_core_dump_store
; audioreactive removed — dead mic on this unit, saves ~15-20KB heap
; Use m5stickc_ppp_wifi_mic env for audio-reactive builds
custom_sdkconfig = ${m5stickc_ppp_wifi_sdkconfig.custom_sdkconfig}

; ============================================================
; Diagnostic: half-res 20x40 virtual (4x4 scale)
; getShowUs() ~3ms -> safeFps ~80fps. Validates timing model.
; ============================================================

[env:m5stickc_ppp_wifi_halfres]
build_unflags = ${common.build_unflags}
  ${esp32_idf_V5.build_unflags}
extends = m5stickc_ppp_board
; No m5stickc_hw -- avoids DEFAULT_LED_COUNT=3200 conflict. Define HW pins directly.
build_flags = ${common.build_flags} ${esp32_idf_V5.build_flags}
  ${m5stickc_lean_disables.build_flags}
  -D BTNPIN=37,39
  -D BTNTYPE=BTN_TYPE_PUSH,BTN_TYPE_PUSH
  -DARDUINO_USB_CDC_ON_BOOT=0
  -D DEFAULT_LED_TYPE=TYPE_SPI_MATRIX
  -D DEFAULT_LED_COUNT=800
  -D LED_TYPES=TYPE_SPI_MATRIX
  -D DATA_PINS=5
  -D WLED_USE_PPP
  -D WLED_USE_PPP_UART
  -D WLED_PPP_WIFI
  -D PPP_BAUD=1500000
  -D PPP_TX_PIN=1
  -D PPP_RX_PIN=3
  -D WLED_DISABLE_IMPROV_WIFISCAN
  -D WLED_ENABLE_DDP_COMPRESSION
  -D WLED_ENABLE_SPI_MATRIX
  -D WLED_SPI_MATRIX_AXP192
  -D WLED_SPI_MATRIX_BOARD_INIT=initAXP192
  -D SPI_MATRIX_W=20
  -D SPI_MATRIX_H=40
  -D USER_SETUP_LOADED
  -D ST7735_DRIVER
  -D ST7735_GREENTAB160x80
  -D CGRAM_OFFSET
  -D TFT_WIDTH=80
  -D TFT_HEIGHT=160
  -D TFT_MOSI=15
  -D TFT_SCLK=13
  -D TFT_CS=5
  -D TFT_DC=23
  -D TFT_RST=18
  -D TFT_MISO=-1
  -D SPI_FREQUENCY=27000000
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_ON
  -D WS_MAX_QUEUED_MESSAGES=2
  -D DEFAULT_MAX_WS_CLIENTS=1
  -D JSON_BUFFER_SIZE=6144
  -D PPP_MRU=1500
  -D PPP_MAXMRU=1500
  -D WLED_RELEASE_NAME=\"M5StickC_PPP_WiFi_HalfRes\"
  -D WLED_WATCHDOG_TIMEOUT=30
  -Wl,-u,esp_core_dump_store
custom_sdkconfig = ${m5stickc_ppp_wifi_sdkconfig.custom_sdkconfig}
lib_deps =
  ${esp32_idf_V5.lib_deps}
  bodmer/TFT_eSPI@^2.5.0

; ============================================================
; Diagnostic: no TFT, WS2812B strip only (PPP+WiFi)
; getShowUs() from WS strip only. Validates WS-only ceiling.
; ============================================================

[env:m5stickc_ppp_wifi_notft]
build_unflags = ${common.build_unflags}
  ${esp32_idf_V5.build_unflags}
extends = m5stickc_ppp_board
; No m5stickc_hw -- that sets DEFAULT_LED_TYPE=TYPE_SPI_MATRIX which we don't want.
; Instead, define HW pins directly with WS2812B defaults.
build_flags = ${common.build_flags} ${esp32_idf_V5.build_flags}
  ${m5stickc_lean_disables.build_flags}
  -D BTNPIN=37,39
  -D BTNTYPE=BTN_TYPE_PUSH,BTN_TYPE_PUSH
  -DARDUINO_USB_CDC_ON_BOOT=0
  -D DEFAULT_LED_TYPE=TYPE_WS2812_RGB
  -D DEFAULT_LED_COUNT=256
  -D DATA_PINS=26
  -D WLED_USE_PPP
  -D WLED_USE_PPP_UART
  -D WLED_PPP_WIFI
  -D PPP_BAUD=1500000
  -D PPP_TX_PIN=1
  -D PPP_RX_PIN=3
  -D WLED_DISABLE_IMPROV_WIFISCAN
  -D WLED_ENABLE_DDP_COMPRESSION
  -D CLIENT_SSID='"kainga-atawhai"'
  -D CLIENT_PASS='"q1w2e3o0"'
  -D WS_MAX_QUEUED_MESSAGES=2
  -D DEFAULT_MAX_WS_CLIENTS=1
  -D JSON_BUFFER_SIZE=6144
  -D PPP_MRU=1500
  -D PPP_MAXMRU=1500
  -D WLED_RELEASE_NAME=\"M5StickC_PPP_WiFi_NoTFT\"
  -D WLED_WATCHDOG_TIMEOUT=30
  -Wl,-u,esp_core_dump_store
custom_sdkconfig = ${m5stickc_ppp_wifi_sdkconfig.custom_sdkconfig}
lib_deps = ${esp32_idf_V5.lib_deps}

; ============================================================
; PPP + WiFi + Audio Reactive (M5StickC built-in SPM1423 PDM mic)
; ============================================================

[env:m5stickc_ppp_wifi_mic]
build_unflags = ${common.build_unflags}
  ${esp32_idf_V5.build_unflags}
extends = m5stickc_ppp_board
build_flags = ${common.build_flags} ${esp32_idf_V5.build_flags}
  ${m5stickc_hw.build_flags}
  ${m5stickc_lean_disables.build_flags}
  -D WLED_USE_PPP
  -D WLED_USE_PPP_UART
  -D WLED_PPP_WIFI
  -D PPP_BAUD=1500000
  -D PPP_TX_PIN=1
  -D PPP_RX_PIN=3
  -D WLED_DISABLE_IMPROV_WIFISCAN
  -D WLED_ENABLE_DDP_COMPRESSION
  -D WLED_ENABLE_GIF
  -D WLED_ENABLE_PIXART
  ${m5stickc_tft_flags.build_flags}
  -D WS_MAX_QUEUED_MESSAGES=2
  -D DEFAULT_MAX_WS_CLIENTS=1
  -D JSON_BUFFER_SIZE=6144
  -D PPP_MRU=1500
  -D PPP_MAXMRU=1500
  ; SPM1423 PDM microphone — CLK=GPIO0, DATA=GPIO34
  -D I2S_SDPIN=34
  -D I2S_WSPIN=0
  -D I2S_CKPIN=-1
  -D I2S_USE_RIGHT_CHANNEL
  -D I2S_USE_16BIT_SAMPLES
  -D SR_DMTYPE=1
  -D WLED_RELEASE_NAME=\"M5StickC_PPP_WiFi_Mic\"
custom_usermods = audioreactive
custom_sdkconfig = ${m5stickc_ppp_wifi_sdkconfig.custom_sdkconfig}
