; PDM Microphone Standalone Test — M5StickC SPM1423
; Tests I2S PDM mic independently of WLED to isolate hardware vs software issues.
;
; Usage:
;   pio run -e legacy_pdm -t upload && pio device monitor -b 115200
;   pio run -e newapi_pdm -t upload && pio device monitor -b 115200

[platformio]
default_envs = legacy_pdm

[env]
board = m5stick-c
platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.05.50/platform-espressif32.zip
framework = arduino
board_build.partitions = default.csv
board_build.flash_mode = dio
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=0

; --- Legacy I2S API test (driver/i2s.h) ---
; Matches M5Stack official SPM1423 example config.
; Tests with and without i2s_set_clk() via serial command.
[env:legacy_pdm]
build_src_filter = +<legacy_pdm_test.cpp>
build_flags =
  ${env.build_flags}
  -D TEST_LEGACY_API

; --- New I2S PDM API test (driver/i2s_pdm.h) ---
; Uses IDF 5.x native PDM RX channel API.
[env:newapi_pdm]
build_src_filter = +<newapi_pdm_test.cpp>
build_flags =
  ${env.build_flags}
  -D TEST_NEW_API

; --- GPIO diagnostic test ---
; Verifies GPIO0 can output clock signal, checks register config during I2S PDM.
[env:gpio_diag]
build_src_filter = +<gpio_diag_test.cpp>
build_flags =
  ${env.build_flags}
  -D TEST_GPIO_DIAG
